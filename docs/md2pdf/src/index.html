<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Markdown to PDF Converter</title>
  
  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <h2>Resume Markdown to PDF</h2>
      <span class="header-tag">A4 Geometry • ATS Vector PDF</span>
    </div>
  </header>

  <main class="app-container">
    <!-- Left Pane: Input & Controls -->
    <section class="pane left-pane">
      <div class="pane-toolbar">
        <div class="toolbar-group">
          <input type="file" id="fileUploadInput" accept=".md,.markdown,.txt" class="hidden-input">
          <button id="btnUpload" class="btn btn-secondary" title="Upload Markdown file">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Upload
          </button>
          <button id="btnLoadExample" class="btn btn-secondary" title="Load example resume from example.md">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            Load example
          </button>
          <button id="btnClear" class="btn btn-secondary" title="Clear editor content">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Clear
          </button>
          <button id="btnSave" class="btn btn-secondary" title="Save editor content as markdown">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Save .md
          </button>
        </div>
        <div class="toolbar-group">
          <button id="btnConvert" class="btn btn-primary" title="Convert markdown to PDF">
            <span id="convertSpinner" class="spinner is-hidden"></span>
            <span id="convertText">Convert markdown to PDF</span>
          </button>
        </div>
      </div>

      <!-- Left Pane Tabs -->
      <div class="tabs-header">
        <button id="tabBtnEdit" class="tab-btn active" data-tab="edit">Edit</button>
        <button id="tabBtnPreview" class="tab-btn" data-tab="preview">Preview</button>
      </div>

      <!-- Edit View -->
      <div id="tabContentEdit" class="tab-content active">
        <textarea id="markdownEditor" spellcheck="false" placeholder="Write or paste your markdown resume here..."></textarea>
      </div>

      <!-- Live Preview View (Standard Markdown as-is) -->
      <div id="tabContentPreview" class="tab-content">
        <div class="preview-scroll">
          <div id="previewContainer" class="preview-body"></div>
        </div>
      </div>
    </section>

    <!-- Right Pane: Native PDF Output -->
    <section class="pane right-pane">
      <div class="pane-toolbar">
        <div class="pane-title">
          <span>Native PDF Preview</span>
        </div>
        <div class="toolbar-group">
          <button id="btnDownloadPdf" class="btn btn-secondary" disabled title="Download the generated vector PDF file">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download PDF
          </button>
          <button id="btnPrintVector" class="btn btn-secondary" disabled title="Print vector PDF">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            Print Vector
          </button>
        </div>
      </div>

      <div id="pdfContainer" class="pdf-container">
        <div id="pdfPlaceholder" class="pdf-placeholder">
          <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <p class="placeholder-text">Click <strong>Convert markdown to PDF</strong> to generate and preview your ATS-friendly PDF in the native browser viewer.</p>
        </div>
        <iframe id="pdfFrame" class="pdf-frame is-hidden" title="Native PDF Preview"></iframe>
      </div>
    </section>
  </main>

  <!-- Application Module Entry Point -->
  <script type="module" src="./main.js"></script>
</body>
</html>
