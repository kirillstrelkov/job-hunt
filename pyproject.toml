[project]
name = "job-hunt"
version = "0.1.0"
description = "Job Hunt & Resume Tailoring Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix",
    "datasets>=2.14.0",
    "deepeval>=1.2.0",
    "dotenv>=0.9.9",
    "easelenium>=0.8.1",
    "giskard>=2.0.0",
    "griffe>=2.0.0",
    "jupyter>=1.1.1",
    "langchain-community<0.4.0",
    "llama-index-llms-ollama>=0.1.0",
    "llama-index>=0.10.0",
    "logfire[system-metrics]>=4.37.0",
    "loguru",
    "matplotlib>=3.10.9",
    "mdformat",
    "nbconvert>=7.17.1",
    "numpy<2.0.0",
    "odfpy>=1.4.1",
    "ollama",
    "openinference-semantic-conventions",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp",
    "opentelemetry-sdk",
    "pandas>=2.0.0",
    "pydantic-ai>=1.107.0",
    "pytest>=8.0.0",
    "python-calamine>=0.8.2",
    "pyyaml",
    "ragas>=0.1.0",
    "ruff",
    "scikit-criteria>=0.8.6",
    "scipy<1.12.0",
    "seaborn>=0.13.2",
    "selenium>=4.44.0",
    "setuptools>=70.0.0",
    "streamlit",
    "tabulate>=0.9.0",
    "tenacity>=9.1.4",
    "textgrad>=0.1.0",
    "tqdm>=4.68.2",
    "trulens-core>=1.0.0",
    "typer>=0.9.0",
    "undetected-chromedriver==3.5.5",
    "webdriver-manager>=4.1.2",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
job-hunt = "job_hunt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "INP001", "D203", "D213", "COM812", "CPY001", "TD", "FIX",
    "ANN", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D401", "D400", "D415",
    "EM", "TRY", "PLR2004", "ERA001", "PTH", "SLF001", "A004", "A001",
    "E501", "PERF", "S101", "T201", "BLE", "E402", "RUF", "S108", "ARG",
    "E741", "C901", "PLC0415", "EXE001", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    "DTZ006", "FBT", "PLW", "RUF100", "B008", "B904", "S603", "S607", "PD015"
]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"**/*_test.py" = ["S101", "FBT001", "D103"]
"**/test_*" = ["S101", "FBT001", "D103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true
